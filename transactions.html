<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Últimos Movimientos</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Encabezado -->
    <header class="bg-primary text-white py-3 shadow-sm" style="background-color: #0A2540 !important;">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0">Alke Wallet 💳</h1>
            <a href="menu.html" class="btn btn-outline-light btn-sm">⬅ Volver al Menú</a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
                    <div>
                        <h2 class="h4 mb-1 font-weight-bold">Historial de Transacciones</h2>
                        <p class="text-muted small mb-0">Actualizado dinámicamente con tus últimos depósitos y envíos.
                        </p>
                    </div>
                </div>

                <!-- TABLA OPTIMIZADA (Se alimenta automáticamente desde app.js) -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="thead-light">
                            <tr>
                                <th scope="col">Fecha y Hora</th>
                                <th scope="col">Tipo / Descripción</th>
                                <th scope="col">Destinatario / Origen</th>
                                <th scope="col" class="text-right">Monto (CLP)</th>
                            </tr>
                        </thead>
                        <!-- El ID es clave para que jQuery renderice los datos aquí -->
                        <tbody id="tabla-movimientos">
                            <!-- Las filas se inyectan en tiempo real por JavaScript -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center py-3 text-muted bg-white border-top mt-auto">
        <small>&copy; 2026 Alke Wallet - Evaluación Frontend</small>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
