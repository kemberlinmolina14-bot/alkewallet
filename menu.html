<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Menú Principal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- BARRA DE NAVEGACIÓN RESPONSIVE (Requerimiento Lección 4) -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark shadow-sm" style="background-color: #0A2540 !important;">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="#">Alke Wallet 💳</a>
            <!-- Botón Hamburguesa para celulares -->
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-md-center">
                    <li class="nav-item active">
                        <span class="nav-link text-white mr-3" id="user-greeting">¡Hola! 👋</span>
                    </li>
                    <li class="nav-item">
                        <a href="transactions.html" class="nav-link text-white-50 mr-3">Movimientos</a>
                    </li>
                    <li class="nav-item mt-2 mt-md-0">
                        <a href="index.html" id="btn-logout" class="btn btn-outline-light btn-sm btn-block">Cerrar
                            Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-5">
        <div class="row">

            <!-- TARJETA DE RESUMEN FINANCIERO DINÁMICO -->
            <div class="col-md-6 mb-4">
                <div class="card bg-white shadow-sm h-100 border-0">
                    <div class="card-body d-flex flex-column justify-content-center text-center py-5">
                        <h2 class="text-muted h6 text-uppercase font-weight-bold">Saldo Disponible</h2>
                        <!-- Nota el ID "current-balance", JavaScript escribirá aquí el monto real -->
                        <p class="display-4 text-success my-2 font-weight-bold" id="current-balance">$0</p>
                        <small class="text-muted">Pesos Chilenos (CLP)</small>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN DE ACCIONES RÁPIDAS (Enlaces directos de navegación) -->
            <div class="col-md-6 mb-4">
                <div class="card bg-white shadow-sm h-100 border-0">
                    <div class="card-body p-4">
                        <h3 class="h5 mb-4 font-weight-bold">Operaciones</h3>
                        <div class="d-flex flex-column">
                            <a href="deposit.html" class="btn btn-success btn-block py-3 mb-3 font-weight-bold">📥
                                Depositar Fondos</a>
                            <a href="sendmoney.html" class="btn btn-primary btn-block py-3 mb-3 font-weight-bold"
                                style="background-color: #0A2540; border-color: #0A2540;">💸 Enviar Dinero</a>
                            <a href="transactions.html"
                                class="btn btn-outline-secondary btn-block py-3 font-weight-bold">📋 Ver Historial
                                Completo</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center py-3 text-muted bg-white border-top mt-auto">
        <small>&copy; 2026 Alke Wallet - Evaluación Frontend</small>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
