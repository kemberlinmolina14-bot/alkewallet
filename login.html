<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Iniciar Sesión</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Tus estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Encabezado Semántico -->
    <header class="bg-primary text-white py-3 shadow-sm">
        <div class="container text-center">
            <h1 class="h3 mb-0">Alke Wallet 💳</h1>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <!-- Tarjeta del Formulario -->
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4 h4">Iniciar Sesión</h2>

                        <form id="form-login">
                            <div class="form-group">
                                <label for="email">Correo Electrónico</label>
                                <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com"
                                    required>
                            </div>
                            <div class="form-group">
                                <label for="password">Contraseña</label>
                                <input type="password" id="password" class="form-control" placeholder="••••••••"
                                    required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block mt-4">Ingresar</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Pie de página Semántico -->
    <footer class="text-center py-3 text-muted bg-white border-top mt-auto">
        <small>&copy; 2026 Alke Wallet - Evaluación Frontend</small>
    </footer>

    <!-- Scripts: jQuery va PRIMERO -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <!-- Tu lógica -->
    <script src="js/app.js"></script>
</body>

</html>
