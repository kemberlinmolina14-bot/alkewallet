<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Depositar Fondos</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Encabezado -->
    <header class="bg-primary text-white py-3 shadow-sm" style="background-color: #0A2540 !important;">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0">Alke Wallet 💳</h1>
            <a href="menu.html" class="btn btn-outline-light btn-sm">⬅ Volver al Menú</a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-auto py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <span class="display-4">📥</span>
                            <h2 class="h4 mt-2 font-weight-bold">Depositar Fondos</h2>
                            <p class="text-muted small">Agrega dinero de forma segura a tu cuenta digital</p>
                        </div>

                        <!-- Formulario -->
                        <form id="form-deposit">
                            <div class="form-group">
                                <label for="amount" class="font-weight-bold">Monto a Depositar (CLP)</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">$</span>
                                    </div>
                                    <input type="number" id="amount"
                                        class="form-control form-control-lg text-success font-weight-bold" min="1"
                                        placeholder="Ej: 20000" required>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="payment-method" class="font-weight-bold">Medio de Pago</label>
                                <select id="payment-method" class="form-control" required>
                                    <option value="" disabled selected>Selecciona una opción</option>
                                    <option value="transfer">Transferencia Bancaria</option>
                                    <option value="credit">Tarjeta de Crédito / Débito</option>
                                </select>
                            </div>

                            <button type="submit"
                                class="btn btn-success btn-block btn-lg font-weight-bold mt-4 shadow-sm">
                                Confirmar Depósito
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DE ÉXITO DE BOOTSTRAP -->
    <div class="modal fade" id="modalExitoDeposito" data-backdrop="static" data-keyboard="false" tabindex="-1"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-body p-5 text-center">
                    <span class="display-3 text-success">✓</span>
                    <h3 class="h4 font-weight-bold mt-3">¡Depósito Exitoso!</h3>
                    <p class="text-muted">Tu saldo se ha actualizado correctamente en el sistema.</p>
                    <!-- Agregamos un ID específico al botón para controlarlo por jQuery -->
                    <button type="button" id="btn-redirigir-deposito"
                        class="btn btn-success btn-block btn-lg mt-4 font-weight-bold shadow-sm">
                        Regresar al Inicio
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pie de página -->
    <footer class="text-center py-3 text-muted bg-white border-top mt-auto">
        <small>&copy; 2026 Alke Wallet - Evaluación Frontend</small>
    </footer>

    <!-- Scripts Esenciales -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
